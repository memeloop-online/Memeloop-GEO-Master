name: Interactive desktop runtime

on:
  push:
    paths:
      # Match the image inputs and its acceptance scripts, not unrelated runner
      # documentation/tests or Web/API changes. Those keep their own CI checks.
      - "packages/browser-runner/Dockerfile.interactive"
      - "packages/browser-runner/.dockerignore"
      - "packages/browser-runner/Dockerfile.interactive.dockerignore"
      - "packages/browser-runner/package.json"
      - "packages/browser-runner/package-lock.json"
      - "packages/browser-runner/src/**"
      - "packages/browser-runner/smoke/**"
      - "packages/browser-runner/test/interactive-desktop-runtime.test.mjs"
      - "packages/browser-runner/THIRD_PARTY_NOTICES.md"
      - "packages/browser-runner/RICH_EDITOR_NOTICES.md"
      - ".github/workflows/interactive-desktop.yml"
  pull_request:
    paths:
      - "packages/browser-runner/Dockerfile.interactive"
      - "packages/browser-runner/.dockerignore"
      - "packages/browser-runner/Dockerfile.interactive.dockerignore"
      - "packages/browser-runner/package.json"
      - "packages/browser-runner/package-lock.json"
      - "packages/browser-runner/src/**"
      - "packages/browser-runner/smoke/**"
      - "packages/browser-runner/test/interactive-desktop-runtime.test.mjs"
      - "packages/browser-runner/THIRD_PARTY_NOTICES.md"
      - "packages/browser-runner/RICH_EDITOR_NOTICES.md"
      - ".github/workflows/interactive-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  linux-desktop:
    name: Isolated headed browser and stock VNC transport
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve registry cache reference
        id: cache
        shell: bash
        env:
          DESKTOP_RECIPE: ${{ hashFiles('packages/browser-runner/Dockerfile.interactive') }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          # Keep build cache separate from the immutable, smoke-tested SHA tags.
          # Recipe-scoped refs avoid unrelated Dockerfiles overwriting this cache.
          printf 'ref=ghcr.io/%s-desktop:buildcache-amd64-%s\n' \
            "$repository" "$DESKTOP_RECIPE" >> "$GITHUB_OUTPUT"
      - name: Authenticate registry cache and tested image publication
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build desktop image with registry layer cache
        uses: docker/build-push-action@v6
        with:
          context: packages/browser-runner
          file: packages/browser-runner/Dockerfile.interactive
          platforms: linux/amd64
          load: true
          push: false
          tags: geo-interactive-smoke:local
          # A missing recipe cache is a normal cold build. PRs only read public
          # cache; registry writes require the authenticated non-PR token.
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max,image-manifest=true,oci-mediatypes=true', steps.cache.outputs.ref) || '' }}
      - name: Exercise the built isolated desktop
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          bash packages/browser-runner/smoke/verify-container.sh --prebuilt 2>&1 | tee logs/interactive-desktop.log
      - name: Export verified desktop image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop-image
          docker tag geo-interactive-smoke:local "geo-interactive:${GITHUB_SHA}"
          docker save "geo-interactive:${GITHUB_SHA}" | zstd -T2 -3 -o desktop-image/image.tar.zst
          docker image inspect "geo-interactive:${GITHUB_SHA}" \
            --format '{{json .}}' > desktop-image/image-inspect.json
          printf '%s\n' "${GITHUB_SHA}" > desktop-image/source-commit.txt
          cd desktop-image
          sha256sum image.tar.zst image-inspect.json source-commit.txt > SHA256SUMS
      - name: Publish the already-tested desktop image
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repository}-desktop:${GITHUB_SHA}"
          docker tag geo-interactive-smoke:local "$image"
          docker push "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' \
            > desktop-image/registry-digests.json
          printf 'Tested desktop image: `%s`. Cluster login verification remains separate.\n' \
            "$image" >> "$GITHUB_STEP_SUMMARY"
          cd desktop-image
          sha256sum registry-digests.json >> SHA256SUMS
      - name: Preserve verified desktop image
        uses: actions/upload-artifact@v4
        with:
          name: interactive-desktop-image-${{ github.sha }}
          path: desktop-image/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Preserve synthetic runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-desktop-diagnostics
          path: logs/interactive-desktop.log
          if-no-files-found: warn
