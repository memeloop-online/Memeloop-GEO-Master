name: Demo application images

on:
  # Manual dispatch deliberately rebuilds both images, regardless of path diff.
  workflow_dispatch:
  push:
    branches: [main, integration/w00-pr-stack]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/demo/Dockerfile.web
      - deploy/demo/nginx.conf
      - .github/workflows/demo-images.yml
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - migrations/**
      - apps/web/**
      - packages/agent-runtime/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - LICENSE
      - scripts/bundle-agent.mjs
      - scripts/verify-web-image.mjs
      - packages/browser-runner/package.json
      - packages/browser-runner/package-lock.json
      - packages/browser-runner/src/observation-extraction-prompt.txt

permissions:
  contents: read
  packages: write

concurrency:
  group: demo-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      components: ${{ github.event_name == 'workflow_dispatch' && '["api","web"]' || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - name: Select images affected by this push
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Compare this push with its previous tip, not the default branch.
          base: ${{ github.ref }}
          filters: |
            api:
              - '.github/workflows/demo-images.yml'
              - '.dockerignore'
              - 'LICENSE'
              - 'Dockerfile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'migrations/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'apps/web/package.json'
              - 'packages/agent-runtime/**'
              - 'packages/browser-runner/package.json'
              - 'packages/browser-runner/src/observation-extraction-prompt.txt'
              - 'scripts/bundle-agent.mjs'
            web:
              - '.github/workflows/demo-images.yml'
              - '.dockerignore'
              - 'LICENSE'
              - 'deploy/demo/Dockerfile.web'
              - 'deploy/demo/nginx.conf'
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'packages/agent-runtime/package.json'
              - 'packages/browser-runner/package.json'
              - 'packages/browser-runner/package-lock.json'
              - 'scripts/verify-web-image.mjs'
  images:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        if: matrix.component == 'web'
        with:
          node-version: "22.17.0"
      - name: Prepare real browser for production frontend check
        if: matrix.component == 'web'
        run: |
          npm ci --prefix packages/browser-runner
          node packages/browser-runner/node_modules/playwright/cli.js install --with-deps chromium
      - name: Resolve immutable image name
        id: image
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "tag=ghcr.io/${repository}-${COMPONENT}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build application image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component == 'api' && 'Dockerfile' || 'deploy/demo/Dockerfile.web' }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=demo-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=demo-${{ matrix.component }}
      - name: Verify image starts without external credentials
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          container="geo-image-smoke-${COMPONENT}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          if [[ "$COMPONENT" == api ]]; then
            export GEO_DEV_PASSWORD
            GEO_DEV_PASSWORD="$(openssl rand -hex 24)"
            docker run -d --name "$container" --network host \
              --read-only --tmpfs /tmp \
              -e GEO_DEV_PASSWORD -e GEO_BIND_ADDR=127.0.0.1:18080 \
              "${IMAGE}@${DIGEST}" >/dev/null
            endpoint=http://127.0.0.1:18080/health/ready
          else
            docker run -d --name "$container" -p 127.0.0.1:18081:8080 \
              --read-only --tmpfs /tmp --add-host api:127.0.0.1 \
              "${IMAGE}@${DIGEST}" >/dev/null
            endpoint=http://127.0.0.1:18081/health/ready
          fi
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 "$endpoint" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            echo "Image failed the isolated readiness check." >&2
            exit 1
          fi
          if [[ "$COMPONENT" == web ]]; then
            curl --fail --silent http://127.0.0.1:18081/login | grep -q '<!doctype html>'
            node scripts/verify-web-image.mjs
          fi
      - name: Record deployment identity
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          mkdir -p image-metadata
          printf '%s\n' "$IMAGE" > image-metadata/image.txt
          printf '%s\n' "$DIGEST" > image-metadata/digest.txt
          printf '%s\n' "$GITHUB_SHA" > image-metadata/source-commit.txt
          printf 'Built and startup-checked `%s` at `%s`. Deployment and full application tests remain separate.\n' \
            "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.component }}-${{ github.sha }}
          path: image-metadata/
          if-no-files-found: error
          retention-days: 14
