    app.kubernetes.io/name: memeloop-geo-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: memeloop-geo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memeloop-geo-web
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memeloop-geo-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: memeloop-geo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: memeloop-geo-web:deployment
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
              scheme: HTTP
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 3
