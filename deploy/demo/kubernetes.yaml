---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: memeloop-geo-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: memeloop-geo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: memeloop-geo-web
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: geo-demo-bootstrap
  labels:
    app.kubernetes.io/name: memeloop-geo-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: memeloop-geo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memeloop-geo-bootstrap
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: memeloop-geo
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: memeloop-geo-api:deployment
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/geo-app
            - --bootstrap
          envFrom:
            - secretRef:
                name: geo-demo-runtime
                optional: false
            - secretRef:
                name: geo-demo-bootstrap
                optional: false
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
