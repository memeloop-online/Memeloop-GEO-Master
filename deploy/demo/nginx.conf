pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    error_log /dev/stderr warn;
    sendfile on;
    keepalive_timeout 65;

    # Upgrade the connection only for the API's desktop WebSocket routes;
    # ordinary requests and SSE keep the connection header empty.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    # The unprivileged image and the cluster pod only need /tmp writable.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    upstream geo_api {
        server api:8080;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 100m;

        location = /health/live {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /health/ready {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Keep the browser same-origin. proxy_pass without a URI preserves the
        # /api/v1/... path expected by the Rust router.
        location = /api {
            proxy_pass http://geo_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            add_header X-Accel-Buffering "no" always;
        }

        location /api/ {
            proxy_pass http://geo_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            add_header X-Accel-Buffering "no" always;
        }

        # Vite emits content-addressed assets. Compress only these public files,
        # including behind an ingress, without buffering/compressing API or SSE.
        location /assets/ {
            try_files $uri =404;
            gzip on;
            gzip_vary on;
            gzip_proxied any;
            gzip_min_length 1024;
            gzip_comp_level 5;
            gzip_types application/javascript text/javascript text/css;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # React Router owns client-side routes. Revalidate the shell so a new
        # deployment can reference new assets; missing assets above stay 404.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
